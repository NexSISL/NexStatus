<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>NexoCat Status</title>

  <!-- Security -->
  <meta http-equiv="X-Content-Type-Options" content="nosniff" />
  <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin" />

  <!-- SEO / Social -->
  <meta name="description" content="Real-time status page for NexoCat Status: services, network, and infrastructure." />
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#a0c322" />
  <meta property="og:title" content="NexoCat Status" />
  <meta property="og:description" content="Real-time status page for NexoCat Status: services, network, and infrastructure." />

  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary" />

  <!-- Favicon -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='16' fill='%2338bdf8'/%3E%3C/svg%3E" />

  <!-- Preconnect / DNS prefetch -->
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="dns-prefetch" href="https://cdnjs.cloudflare.com" />
  <link rel="preload" as="image" href="https://cdn.nexorabot.xyz/NexoCat/NexoraXNetCat.webp" fetchpriority="high" />
  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <!-- Font Awesome (integrity check for SRI) -->
  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />

  <link rel="stylesheet" href="main.css" />

  <!-- Injected appearance (avoids FOUC of default branding) -->
  <style id="ssr-appearance">
    :root {
      --accent: 160 195 34;
      --accent-strong: 14 165 233;
      --bg-1: 8 14 28;
      --bg-2: 4 8 20;
      --card-bg: 255 255 255;
      --muted: 148 163 184;
      --success: 34 197 94;
      --danger: 239 68 68;
      --warning: 245 158 11;
      --info: 59 130 246;
      --font-family: Inter, system-ui, sans-serif;
      --page-bg-image: url(https://cdn.nexorabot.xyz/NexoCat/NexoraXNetCat.webp);
    }
  </style>
</head>

<body>
  <main class="container">
    <div id="app-loading-shell" class="app-loading-shell" aria-live="polite">
      <div class="app-loading-backdrop"></div>
      <div class="spinner" aria-hidden="true">
        <div></div><div></div><div></div><div></div><div></div><div></div><div></div><div></div><div></div><div></div>
      </div>
    </div>

    <!-- ══ MAIN VIEW (HOME) ══ -->
    <div id="view-home" class="spa-view" hidden>

      <!-- HEADER -->
      <header>
        <div class="brand">

          <div class="title">
            <strong id="brand-title">NexoCat Status</strong>
            <span id="brand-subtitle">Información en tiempo real • Uptime y incidentes • Historial de 30 días</span>
          </div>
        </div>
      </header>

      <!-- ANUNCIOS -->
      <div id="announcements-bar" role="region" aria-label="Announcements"></div>

      <!-- STATUS GENERAL -->
      <section class="hero" aria-label="Overall system status">
        <div class="status-dot status-up" role="img" aria-label="Status: operational"></div>
        <div>
          <h2 id="site-status">Loading status...</h2>
          <p><span data-text-key="last-check-label">Última verificación:</span> <time id="last-checked" datetime="">–</time></p>
        </div>
        <div class="uptime" aria-label="Total availability">
          <div data-text-key="total-uptime-label">Disponibilidad total</div>
          <strong id="uptime-percent" aria-live="polite">–</strong>
          <button id="btn-global-uptime" class="uptime-history-link" type="button">
            <span data-text-key="global-uptime-history-link">Ver histórico global</span>
          </button>
        </div>
      </section>

      <!-- INCIDENTES ACTIVOS -->
      <div id="incidents-section" role="region" aria-label="Active incidents"></div>

      <!-- VISTA RÁPIDA -->
      <section class="quick-view-section" aria-label="Services quick view">
        <h3 data-text-key="services-status-title">Estado de servicios</h3>
        <div class="quick-view-grid" id="quick-view-grid"></div>
      </section>

      <!-- DETALLES COMPLETOS -->
      <section class="details-section" aria-label="Service details">
        <h3 data-text-key="service-details-title">Detalles por servicio</h3>
        <div class="grid" id="services-grid"></div>
      </section>

      <!-- HISTORIAL DE INCIDENTES -->
      <div id="incidents-history" role="region" aria-label="Incident history"></div>

      <footer id="public-footer">
        © <span id="year"></span> <span id="footer-text-content">Status Monitor</span>
      </footer>

    </div><!-- /view-home -->

    <!-- ══ SERVICE DETAIL VIEW (SPA) ══ -->
    <div id="view-service" class="spa-view" hidden
         role="main" aria-label="Service detail">
      <!-- Dynamically rendered by servicedetail.js -->
    </div>

    <!-- ══ GLOBAL UPTIME HISTORY VIEW (SPA) ══ -->
    <div id="view-global-uptime" class="spa-view" hidden
         role="main" aria-label="Global uptime history">
      <!-- Dynamically rendered by globaluptime.js -->
    </div>

  </main>

  <!-- JS modules (dependency order) -->
  <script src="js/appearance.js"></script>
  <script src="js/utils.js" defer></script>
  <script src="js/icons.js" defer></script>
  <script src="js/announcements.js" defer></script>
  <script src="js/incidents.js" defer></script>
  <script src="js/history.js" defer></script>
  <script src="js/sparkline.js" defer></script>
  <script src="js/cards.js" defer></script>
  <script src="js/servicedetail.js" defer></script>
  <script src="js/globaluptime.js" defer></script>
  <script src="js/main.js" defer></script>
</body>

</html>
